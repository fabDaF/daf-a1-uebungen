<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aktivitäten mit Familie (A1.1)</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
h1 { text-align: center; color: #333; margin-bottom: 4px; font-size: 1.5em; }
.subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.95em; }
/* ===== NAV (Variante C: Aktiv-Pille) ===== */
.nav {
  display: flex; flex-wrap: wrap; gap: 4px;
  background: #eef0fb; padding: 6px;
  border-bottom: 2px solid #e9ecef;
}
.nav-btn {
  flex: 1 1 auto; min-width: 64px; padding: 12px 8px;
  border: none; background: none; cursor: pointer;
  font-weight: 500; color: #666; transition: all 0.2s; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.nav-btn:hover { background: #e1e5fb; color: #667eea; }
.nav-btn.active { background: #fff; color: #667eea; font-weight: 700; box-shadow: 0 1px 4px rgba(102,126,234,.25); }
.nav-emoji { font-size: 1.3em; line-height: 1.2; }
.nav-label { font-size: 0.78em; margin-top: 2px; line-height: 1.2; }

        
.section { display: none; }
.section.active { display: block; }
h2 { color: #333; font-size: 1.15em; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #f0f0f0; }
.btn-row { display: flex; gap: 6px; }
.btn { background: #f5f7ff; border: 1px solid #c5cff5; border-radius: 8px; padding: 6px 16px; font-size: 0.85em; color: #667eea; cursor: pointer; transition: all 0.15s; font-weight: 500; }
.btn-show { background: #f0f0f0; color: #555; }
.btn-show:hover { background: #e0e0e0; }
.timer-display { display: flex; gap: 14px; font-size: 0.82em; color: #bbb; font-variant-numeric: tabular-nums; }
.help-box { background: #f8f9ff; border-left: 4px solid #667eea; border-radius: 0 10px 10px 0; padding: 14px 18px; margin-bottom: 20px; font-size: 0.9em; line-height: 1.7; color: #444; }
.help-box strong { color: #667eea; }

/* L&uuml;cken&uuml;bung */
.ex-card { background: #f8f9ff; padding: 16px 20px; margin-bottom: 14px; border-radius: 10px; border-left: 4px solid #667eea; position: relative; }
.ex-badge { position: absolute; top: 10px; right: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-size: 0.7em; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
.ex-sentence { font-size: 1.0em; line-height: 2.4; color: #333; display: block; }
.nowrap-group { display: inline-flex; align-items: baseline; white-space: nowrap; gap: 0; }
input.blank { border: none; border-bottom: 2px solid #667eea; background: #fff; padding: 4px 8px; font-family: inherit; font-size: 0.95em; outline: none; transition: all 0.2s; }
input.blank:focus { border-bottom-color: #764ba2; background: #f0f7ff; }
input.blank.s { min-width: 50px; width: 50px; }
input.blank.m { min-width: 90px; width: 90px; }
input.blank.l { min-width: 150px; width: 150px; }
input.blank.xl { min-width: 200px; width: 200px; }
input.blank.correct { border-bottom-color: #27ae60; background: #e8f8f0; }
input.blank.wrong { border-bottom-color: #e74c3c; background: #fdeaea; }
.correction-hint { color: #27ae60; font-weight: 600; font-size: 0.85em; margin-left: 4px; white-space: nowrap; }

/* Zuordnung / Befinden */
.befinden-categories { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.zuordnung-cat { background: #f0f0f0; border: 2px dashed #ccc; border-radius: 10px; padding: 12px; min-height: 100px; }
.zuordnung-cat-title { font-weight: 700; color: #667eea; text-align: center; margin-bottom: 8px; font-size: 0.95em; }
.chip-bank { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; background: #f8f8f8; border-radius: 10px; min-height: 60px; }
.chip { background: white; border: 2px solid #667eea; color: #667eea; padding: 8px 14px; border-radius: 20px; cursor: move; font-weight: 500; font-size: 0.9em; transition: all 0.2s; user-select: none; }
.chip:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
.chip.placed { background: #667eea; color: white; }
.chip.correct { background: #27ae60; border-color: #27ae60; color: white; }
.chip.wrong { background: #e74c3c; border-color: #e74c3c; color: white; }
/* Aliase für neues satzbau-drag-drop Pattern */
.chips-container { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; background: #f8f8f8; border-radius: 10px; min-height: 60px; margin-bottom: 10px; }
.sentence-builder { background: white; border: 2px dashed #ccc; border-radius: 10px; padding: 14px; min-height: 60px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip.incorrect { background: #e74c3c; border-color: #e74c3c; color: white; }
.sb-punkt { font-size: 1.1em; font-weight: 700; color: #27ae60; margin-left: 2px; align-self: center; user-select: none; }
.satzbau-feedback { font-size: 0.9em; font-weight: 600; margin-top: 6px; min-height: 1.2em; }
.satzbau-feedback.correct { color: #27ae60; }
.satzbau-feedback.incorrect { color: #e74c3c; }
/* Vocab */
.vocab-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap; }
.vocab-en { color: #888; font-size: 0.9em; min-width: 180px; flex-shrink: 0; }
.vocab-arrow { color: #667eea; font-weight: 700; flex-shrink: 0; }
.vocab-inputs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.vocab-inputs input { border: none; border-bottom: 2px solid #667eea; background: #fff; padding: 4px 8px; font-family: inherit; font-size: 0.9em; outline: none; }
.vocab-inputs input.art { width: 50px; }
.vocab-inputs input.wort { width: 130px; }
.vocab-inputs input.plural { width: 140px; }
.vocab-inputs input.correct { border-bottom-color: #27ae60; background: #e8f8f0; }
.vocab-inputs input.wrong { border-bottom-color: #e74c3c; background: #fdeaea; }
.vocab-hint { color: #27ae60; font-weight: 700; font-size: 0.85em; margin-left: 4px; }
.satzbau-item { margin-bottom: 20px; }
.placeholder-box { background: #f8f9ff; border: 2px dashed #c5cae9; border-radius: 10px; padding: 30px; text-align: center; color: #9fa8da; font-size: 0.95em; }
.placeholder-box strong { display: block; font-size: 1.1em; color: #667eea; margin-bottom: 8px; }
/* ===== GENUS-TAB ===== */
.genus-pool { display:flex; flex-wrap:wrap; gap:10px; padding:16px; background:#f0f0f8; border:1px dashed #bbb; border-radius:10px; min-height:60px; margin-bottom:18px; }
.genus-chip { background:#fff; border:2px solid #667eea; color:#333; padding:8px 14px; border-radius:14px; font-weight:600; font-size:0.95em; cursor:grab; user-select:none; }
.genus-chip.dragging { opacity:0.5; }
.genus-chip.selected { outline:3px solid #f39c12; }
.genus-chip.correct { border-color:#2e7d32; background:#e8f5e9; color:#1b5e20; }
.genus-chip.wrong { border-color:#c62828; background:#ffebee; color:#b71c1c; }
.genus-kategorien { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.genus-kat { background:#fafaff; border-radius:10px; padding:10px; border-top:4px solid #999; }
.genus-kat.kat-der { border-top-color:#1565c0; }
.genus-kat.kat-die { border-top-color:#ad1457; }
.genus-kat.kat-das { border-top-color:#1b5e20; }
.genus-kat.kat-pl  { border-top-color:#5e35b1; }
.kat-title { text-align:center; font-weight:700; margin-bottom:8px; font-size:1.05em; }
.kat-der .kat-title { color:#1565c0; } .kat-die .kat-title { color:#ad1457; } .kat-das .kat-title { color:#1b5e20; } .kat-pl .kat-title { color:#5e35b1; }
.genus-drop { min-height:90px; background:#fff; border:2px dashed #ccc; border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:6px; }
.genus-drop.dragover { border-color:#667eea; background:#eef1ff; }
@media (max-width:600px){ .genus-kategorien { grid-template-columns:repeat(2,1fr); } }

/* FB-JUMPTOP - Nach-oben-Button (Glas-Look) */
.fb-jumptop {
  position: fixed; bottom: 30px;
  right: max(18px, calc(50vw - 500px + 14px));
  background: rgba(118, 75, 162, 0.26);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  backdrop-filter: blur(14px) saturate(180%);
  color: #34206b; border: 1.5px solid rgba(255,255,255,0.75); border-radius: 28px;
  padding: 15px 26px; font-size: 1.05em; font-weight: 800;
  letter-spacing: 0.2px;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  cursor: pointer;
  box-shadow: 0 8px 28px rgba(102,126,234,0.40), inset 0 1px 0 rgba(255,255,255,0.6);
  text-shadow: 0 1px 1px rgba(255,255,255,0.55);
  opacity: 0; visibility: hidden; transform: translateY(10px);
  transition: opacity .25s, visibility .25s, transform .25s, background .2s, box-shadow .2s;
  z-index: 9999; display: inline-flex; align-items: center; gap: 8px;
}
.fb-jumptop.show { opacity: 1; visibility: visible; transform: translateY(0); }
.fb-jumptop:hover { background: rgba(118, 75, 162, 0.40); color: #241048; box-shadow: 0 10px 32px rgba(102,126,234,0.50), inset 0 1px 0 rgba(255,255,255,0.65); }
@media (max-width: 600px) { .fb-jumptop { bottom: 18px; right: 16px; padding: 12px 18px; font-size: 0.95em; } }
</style>

<script>

/* ========== TIMER & STATE ========== */
const TIMER_PREFIX = 'DE_A1_1024C';
var timerState = [
    {seconds: 0, running: false, stopped: false, interval: null},
    {seconds: 0, running: false, stopped: false, interval: null},
    {seconds: 0, running: false, stopped: false, interval: null},
    {seconds: 0, running: false, stopped: false, interval: null},
    {seconds: 0, running: false, stopped: false, interval: null},
    {seconds: 0, running: false, stopped: false, interval: null},
    {seconds: 0, running: false, stopped: false, interval: null},
];

function startTimer(idx) {
    var s = timerState[idx];
    if (s.running || s.stopped) return;
    s.running = true;
    s.interval = setInterval(function() { s.seconds++; document.getElementById('timer-' + idx).textContent = formatTime(s.seconds); }, 1000);
}

function stopTimer(idx) {
    var s = timerState[idx];
    clearInterval(s.interval);
    s.running = false;
    s.stopped = true;
    var best = localStorage.getItem(TIMER_PREFIX + '-best-' + idx);
    if (!best || s.seconds < parseInt(best)) { localStorage.setItem(TIMER_PREFIX + '-best-' + idx, s.seconds); document.getElementById('best-' + idx).textContent = formatTime(s.seconds); }
}

function resetTimer(idx) {
    var s = timerState[idx];
    clearInterval(s.interval);
    s.seconds = 0;
    s.running = false;
    s.stopped = false;
    document.getElementById('timer-' + idx).textContent = '00:00';
}

function formatTime(sec) {
    return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
}

function loadBestTimes() {
    document.querySelectorAll('[id^="best-"]').forEach(function(el) {
        var idx = el.id.split('-')[1];
        var val = localStorage.getItem(TIMER_PREFIX + '-best-' + idx);
        if (val) el.textContent = formatTime(parseInt(val));
    });
}

/* ========== LIVE INPUT FEEDBACK ========== */
function liveCheck(inp) {
    var user = inp.value;
    var answer = inp.dataset.answer;
    inp.classList.remove('correct', 'wrong');
    if (user.length === 0) return;
    var cmpUser = user.trim().toLowerCase();
    var cmpAnswer = (answer || '').toLowerCase();
    if (cmpUser === cmpAnswer) { inp.classList.add('correct'); }
    else if (cmpAnswer.indexOf(cmpUser) === 0) { }
    else { inp.classList.add('wrong'); }
}

/* ========== AUTO-COMPLETE DETECTION ========== */
function checkAllDragDrop(secId, dataLen, timerIdx) {
    var cats = document.querySelectorAll('#sec-' + secId + ' .genus-cat');
    var correctCount = 0;
    cats.forEach(function(cat) {
        cat.querySelectorAll('.chip').forEach(function(chip) {
            if (chip.classList.contains('correct')) correctCount++;
        });
    });
    if (correctCount === dataLen) stopTimer(timerIdx);
}

function checkAllInputs(secSelector, timerIdx) {
    var inputs = document.querySelectorAll(secSelector);
    var allCorrect = inputs.length > 0;
    inputs.forEach(function(inp) {
        if (!inp.classList.contains('correct')) allCorrect = false;
    });
    if (allCorrect) stopTimer(timerIdx);
}

/* ========== UNIVERSAL DRAG & DROP ========== */
function allowDrop(e) { e.preventDefault(); }

/* ========== GENERIC LUECKENTEXT RENDERER ========== */
function renderLuecken(containerId, data, blankClass, timerIdx) {
    var container = document.getElementById(containerId);
    container.innerHTML = '';
    data.forEach(function(ex) {
        var card = document.createElement('div');
        card.className = 'ex-card';
        if (ex.verb) {
            var badge = document.createElement('div');
            badge.className = 'ex-badge';
            badge.textContent = ex.verb;
            card.appendChild(badge);
        }
        var sentence = document.createElement('div');
        sentence.className = 'ex-sentence';
        var skipNext = false;
        ex.segments.forEach(function(seg, si) {
            if (skipNext) { skipNext = false; return; }
            if (seg.t !== undefined) {
                var nextSeg = ex.segments[si + 1];
                if (nextSeg && nextSeg.b !== undefined && !seg.t.endsWith(' ') && seg.t.length > 0) {
                    var group = document.createElement('span');
                    group.className = 'nowrap-group';
                    var txt = document.createElement('span');
                    txt.textContent = seg.t;
                    group.appendChild(txt);
                    var inp = document.createElement('input');
                    inp.type = 'text';
                    inp.className = 'blank ' + blankClass + ' ' + nextSeg.s;
                    inp.dataset.answer = nextSeg.b;
                    inp.setAttribute('autocomplete', 'off');
                    inp.setAttribute('autocorrect', 'off');
                    inp.setAttribute('autocapitalize', 'off');
                    inp.setAttribute('spellcheck', 'false');
                    inp.onfocus = function() { startTimer(timerIdx); };
                    inp.oninput = function() { liveCheck(this); checkAllInputs('.' + blankClass, timerIdx); };
                    group.appendChild(inp);
                    sentence.appendChild(group);
                    skipNext = true;
                } else {
                    var txt2 = document.createElement('span');
                    txt2.textContent = seg.t;
                    sentence.appendChild(txt2);
                }
            } else if (seg.b !== undefined) {
                var inp2 = document.createElement('input');
                inp2.type = 'text';
                inp2.className = 'blank ' + blankClass + ' ' + seg.s;
                inp2.dataset.answer = seg.b;
                inp2.setAttribute('autocomplete', 'off');
                inp2.setAttribute('autocorrect', 'off');
                inp2.setAttribute('autocapitalize', 'off');
                inp2.setAttribute('spellcheck', 'false');
                inp2.onfocus = function() { startTimer(timerIdx); };
                inp2.oninput = function() { liveCheck(this); checkAllInputs('.' + blankClass, timerIdx); };
                sentence.appendChild(inp2);
            }
        });
        card.appendChild(sentence);
        container.appendChild(card);
    });
}

function showLueckenLoesung(blankClass, timerIdx) {
    document.querySelectorAll('.' + blankClass).forEach(function(inp) {

        if (inp.value.trim() === answer) {

/* ========== SATZBAU RENDERING & FUNCTIONS ========== */
var sbDragged = null;

function getSbCursor() {
    var c = document.getElementById('sb-insert-cursor');
    if (!c) {
        c = document.createElement('div');
        c.id = 'sb-insert-cursor';
        c.style.cssText = 'width:3px;min-height:32px;background:#e67e22;border-radius:2px;align-self:stretch;pointer-events:none;flex-shrink:0;';
    }
    return c;
}

function getSbInsertPos(zone, clientX) {
    var chips = Array.from(zone.querySelectorAll('.chip'));
    for (var i = 0; i < chips.length; i++) {
        var r = chips[i].getBoundingClientRect();
        if (clientX < r.left + r.width / 2) return chips[i];
    }
    return null;
}

function sbCapitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
}

function sbUpdateCapitalization(row) {
    var chips = Array.from(row.querySelectorAll('.chip'));
    chips.forEach(function(c, i) {
        var orig = c.dataset.orig;
        var isProper = orig.charAt(0) === orig.charAt(0).toUpperCase() && orig.charAt(0) !== orig.charAt(0).toLowerCase();
        if (isProper) {
            c.textContent = orig;
        } else {
            c.textContent = (i === 0) ? sbCapitalize(orig) : orig;
        }
    });
}

function sbMakeChip(word) {
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = word;
    chip.dataset.orig = word;
    chip.draggable = true;
    chip.addEventListener('dragstart', function(e) {
        sbDragged = chip;
        e.dataTransfer.setData('text/plain', '');
        setTimeout(function() { chip.style.opacity = '0.4'; }, 0);
    });
    chip.addEventListener('dragend', function() {
        chip.style.opacity = '';
        sbDragged = null;
        var c = document.getElementById('sb-insert-cursor');
        if (c && c.parentNode) c.parentNode.removeChild(c);
    });
    return chip;
}

function sbRegisterZone(zone, idx) {
    zone.addEventListener('dragover', function(e) {
        e.preventDefault();
        if (!sbDragged) return;
        var cursor = getSbCursor();
        var before = getSbInsertPos(zone, e.clientX);
        if (before) zone.insertBefore(cursor, before);
        else zone.appendChild(cursor);
    });
    zone.addEventListener('dragleave', function(e) {
        if (!zone.contains(e.relatedTarget)) {
            var c = document.getElementById('sb-insert-cursor');
            if (c && c.parentNode === zone) zone.removeChild(c);
        }
    });
    zone.addEventListener('drop', function(e) {
        e.preventDefault();
        if (!sbDragged) return;
        var cursor = document.getElementById('sb-insert-cursor');
        if (cursor && cursor.parentNode === zone) {
            zone.insertBefore(sbDragged, cursor);
            zone.removeChild(cursor);
        } else {
            zone.appendChild(sbDragged);
        }
        sbDragged = null;
        var row = document.getElementById('sb-row-' + idx);
        sbUpdateCapitalization(row);
        sbCheckAuto(idx);
    });
}

function sbColorRow(idx) {
    var row = document.getElementById('sb-row-' + idx);
    var chips = Array.from(row.querySelectorAll('.chip'));
    var order = chips.map(function(c) { return c.dataset.orig; });
    var ok = SATZBAU[idx].valid.some(function(v) { return v.length === order.length && v.every(function(p, i) { return p === order[i]; }); });
    chips.forEach(function(c) { c.classList.remove('correct', 'wrong'); c.classList.add(ok ? 'correct' : 'wrong'); });
    return ok;
}

function sbCheckAuto(idx) {
    var row = document.getElementById('sb-row-' + idx);
    var bank = document.getElementById('sb-bank-' + idx);
    var bankChips = bank.querySelectorAll('.chip');
    if (bankChips.length > 0) { sbColorRow(idx); return; }
    if (sbColorRow(idx)) {
        var allDone = true;
        for (var i = 0; i < SATZBAU.length; i++) {
            var b = document.getElementById('sb-bank-' + i);
            if (b && b.querySelectorAll('.chip').length > 0) { allDone = false; break; }
            if (!sbColorRow(i)) { allDone = false; break; }
        }
        if (allDone) stopTimer(1);
    }
}

function renderSatzbau() {
    var container = document.getElementById('satzbauContainer');
    container.innerHTML = '';
    SATZBAU.forEach(function(ex, idx) {
        var item = document.createElement('div');
        item.className = 'satzbau-item';
        var rowId = 'sb-row-' + idx;
        var bankId = 'sb-bank-' + idx;
        var row = document.createElement('div');
        row.id = rowId;
        row.className = 'sentence-builder';
        row.ondragover = function(e) { e.preventDefault(); };
        sbRegisterZone(row, idx);
        var bank = document.createElement('div');
        bank.id = bankId;
        bank.className = 'chips-container';
        bank.ondragover = function(e) { e.preventDefault(); };
        sbRegisterZone(bank, idx);
        ex.parts.forEach(function(p) { bank.appendChild(sbMakeChip(p)); });
        item.appendChild(row);
        item.appendChild(bank);
        container.appendChild(item);
    });
}

function showSatzbauLoesung() {
    SATZBAU.forEach(function(ex, idx) {
        var row = document.getElementById('sb-row-' + idx);
        var bank = document.getElementById('sb-bank-' + idx);

        bank.innerHTML = '';
        ex.valid[0].forEach(function(part) { row.appendChild(sbMakeChip(part)); });
        sbUpdateCapitalization(row);
        sbColorRow(idx);
    });
    stopTimer(1);
}

function resetSatzbau() {
    renderSatzbau();
}

var GENUS_DATA = [
  { word: "Name", cat: "der" },
  { word: "Mann", cat: "der" },
  { word: "Freund", cat: "der" },
  { word: "Gruß", cat: "der" },

  { word: "Telefon", cat: "das" },
  { word: "Foto", cat: "das" },
  { word: "Heft", cat: "das" },
  { word: "Buch", cat: "das" },
  { word: "Namen", cat: "pl" },
  { word: "Männer", cat: "pl" },

  { word: "Länder", cat: "pl" },
  { word: "Freunde", cat: "pl" },
  { word: "Wörter", cat: "pl" }
];
var GENUS_TIMER = 3;
var draggedGenus = null, selectedGenus = null;
var genusSec = 0, genusInt = null;
function genusFmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function genusTimerStart(){ if(genusInt) return; genusInt=setInterval(function(){ genusSec++; var el=document.getElementById('timer-'+GENUS_TIMER); if(el) el.textContent=genusFmt(genusSec); },1000); }
function genusTimerStop(){ if(genusInt){ clearInterval(genusInt); genusInt=null; } var b=document.getElementById('best-'+GENUS_TIMER); if(b){ var pv=/^\d\d:\d\d$/.test(b.textContent)?parseInt(b.textContent.slice(0,2))*60+parseInt(b.textContent.slice(3)):1e9; if(genusSec<pv) b.textContent=genusFmt(genusSec); } }
function genusTimerReset(){ if(genusInt){ clearInterval(genusInt); genusInt=null; } genusSec=0; var el=document.getElementById('timer-'+GENUS_TIMER); if(el) el.textContent='00:00'; }
function shuffleGenus(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function createGenusChip(d){
  var chip=document.createElement('div');
  chip.className='genus-chip'; chip.draggable=true; chip.dataset.cat=d.cat; chip.textContent=d.word;
  chip.addEventListener('dragstart',function(e){ genusTimerStart(); draggedGenus=chip; chip.classList.add('dragging'); e.dataTransfer.setData('text/plain',''); });
  chip.addEventListener('dragend',function(){ chip.classList.remove('dragging'); });
  chip.addEventListener('click',function(){
    if(selectedGenus===chip){ chip.classList.remove('selected'); selectedGenus=null; return; }
    if(selectedGenus) selectedGenus.classList.remove('selected');
    selectedGenus=chip; chip.classList.add('selected'); genusTimerStart();
  });
  return chip;
}
function initGenus(){
  var pool=document.getElementById('genusPool'); if(!pool) return;
  pool.innerHTML='';
  ['der','die','das','pl'].forEach(function(c){ var z=document.getElementById('drop-'+c); if(z) z.innerHTML=''; });
  var fb=document.getElementById('genusFeedback'); if(fb) fb.textContent='';
  shuffleGenus(GENUS_DATA).forEach(function(d){ pool.appendChild(createGenusChip(d)); });
  document.querySelectorAll('#sec-3 .genus-drop').forEach(function(zone){
    zone.addEventListener('dragover',function(e){ e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave',function(){ zone.classList.remove('dragover'); });
    zone.addEventListener('drop',function(e){ e.preventDefault(); zone.classList.remove('dragover'); if(!draggedGenus) return; zone.appendChild(draggedGenus); checkGenusChip(draggedGenus, zone.dataset.cat); draggedGenus=null; updateGenusFeedback(); });
    zone.addEventListener('click',function(){ if(!selectedGenus) return; zone.appendChild(selectedGenus); checkGenusChip(selectedGenus, zone.dataset.cat); selectedGenus.classList.remove('selected'); selectedGenus=null; updateGenusFeedback(); });
  });
  pool.addEventListener('dragover',function(e){ e.preventDefault(); });
  pool.addEventListener('drop',function(e){ e.preventDefault(); if(draggedGenus){ pool.appendChild(draggedGenus); draggedGenus.classList.remove('correct','wrong'); draggedGenus=null; updateGenusFeedback(); } });
}
function checkGenusChip(chip,cat){
  var ok=chip.dataset.cat===cat;
  chip.classList.toggle('correct',ok); chip.classList.toggle('wrong',!ok);
  if(!ok){ setTimeout(function(){ chip.classList.remove('wrong'); document.getElementById('genusPool').appendChild(chip); updateGenusFeedback(); },900); }
}
function updateGenusFeedback(){
  var platziert=document.querySelectorAll('#sec-3 .genus-drop .genus-chip').length;
  var richtig=document.querySelectorAll('#sec-3 .genus-drop .genus-chip.correct').length;
  var fb=document.getElementById('genusFeedback'); if(!fb) return;
  if(platziert===0){ fb.textContent=''; return; }
  fb.textContent=richtig+' von '+GENUS_DATA.length+' richtig zugeordnet.';
  fb.style.color=(richtig===GENUS_DATA.length)?'#2e7d32':'#555';
  if(richtig===GENUS_DATA.length) genusTimerStop();
}
function showGenusLoesung(){
  Array.from(document.querySelectorAll('#sec-3 .genus-chip')).forEach(function(chip){
    var z=document.getElementById('drop-'+chip.dataset.cat);
    if(z){ z.appendChild(chip); chip.classList.remove('wrong'); chip.classList.add('correct'); }
  });
  updateGenusFeedback();
}
function resetGenus(){ initGenus(); genusTimerReset(); }
(function(){ initGenus(); })();
</script>
